# Canonical API endpoints — source of truth.
# Full contract: docs/openapi.json
# Auth header: Bearer {accessToken} (except /auth/login, /auth/refresh, /portal/auth)

Auth:
  POST /auth/login: "{ email, password } -> AuthResponse"
  POST /auth/refresh: "{ refreshToken } -> AuthResponse"
  POST /auth/logout: "{ refreshToken } -> 204"
  POST /auth/change-password: "{ currentPassword, newPassword } -> 204 [Auth required]"

Patients:
  GET /patients: "?page,pageSize,search,sortBy,sortDirection,email,healthInsurance -> PagedResult<PatientResponse> [ClinicAdminOrSecretary]"
  POST /patients: "{ identification (sex: Masculino|Feminino|Prefiro não informar), insurance/marketing, contacts, address, complementary data, notes } -> 201 PatientResponse [ClinicAdminOrSecretary]"
  PATCH /patients/{id}: "{ all editable patient fields; cpf remains immutable } -> PatientResponse [ClinicAdminOrSecretary]"
  DELETE /patients/{id}: "-> 204 (soft delete, audit logged) [ClinicAdminOrSecretary]"
  POST /patients/{id}/access-token/regenerate: "-> new Guid (regenerates patientAccessToken) [ClinicAdminOrSecretary]"
  GET /address/cep/{cep}: "-> CepAddressResponse via ViaCEP [ClinicAdminOrSecretary]"
  # Documents:
  GET /patients/{id}/documents: "-> PatientDocumentResponse[] [ClinicStaff]"
  POST /patients/{id}/documents/upload: "multipart -> 201 PatientDocumentResponse [ClinicStaff]"
  GET /patients/{id}/documents/{docId}/download: "-> file stream [ClinicStaff]"
  DELETE /patients/{id}/documents/{docId}: "-> 204 (soft delete, audit logged) [ClinicStaff]"

Doctors:
  GET /doctors: "?page,pageSize,search,sortBy,sortDirection -> PagedResult<DoctorResponse> (includes Specialties list) [ClinicAdminOrSecretary]"
  POST /doctors: "{ name, crm, phone?, email?, clinicSharePercentage, specialtyIds } -> 201 DoctorResponse [ClinicAdminOrSecretary]"
  PUT /doctors/{id}: "{ name, phone?, email?, isActive, clinicSharePercentage, specialtyIds } -> DoctorResponse [ClinicAdminOrSecretary]"
  DELETE /doctors/{id}: "-> 204 (soft delete, audit logged) [ClinicAdminOrSecretary]"

Appointments:
  GET /appointments: "?page,pageSize,date,dateFrom,dateTo,doctorId,status -> PagedResult<AppointmentResponse> [ClinicStaff]"
  POST /appointments: "{ patientId, doctorId, startAt, durationMinutes, notes?, appointmentTypeId, amount } -> 201 AppointmentResponse [ClinicStaff]"
  PATCH /appointments/{id}: "{ doctorId?, startAt?, durationMinutes?, notes?, appointmentTypeId?, amount? } -> AppointmentResponse [ClinicStaff]"
  POST /appointments/{id}/confirm: "-> AppointmentResponse [ClinicStaff]"
  POST /appointments/{id}/cancel: "-> AppointmentResponse (also cancels receivable if not Paid) [ClinicStaff]"
  POST /appointments/{id}/in-progress: "-> AppointmentResponse [ClinicStaff]"
  POST /appointments/{id}/complete: "-> AppointmentResponse [ClinicStaff]"
  POST /appointments/{id}/no-show: "-> AppointmentResponse [ClinicStaff]"

AppointmentTypes:
  GET /appointment-types: "?page,pageSize,search -> PagedResult<AppointmentTypeResponse> [ClinicStaff]"
  POST /appointment-types: "{ name } -> 201 AppointmentTypeResponse [ClinicAdminOrSecretary]"
  PUT /appointment-types/{id}: "{ name } -> AppointmentTypeResponse [ClinicAdminOrSecretary]"
  DELETE /appointment-types/{id}: "-> 204 (soft delete; rejected while in use) [ClinicAdminOrSecretary]"

Financial:
  GET /financial/receivables: "?page,pageSize,status,dateFrom,dateTo -> PagedResult<ReceivableResponse> (includes linked appointment date, type, status and doctor) [ClinicStaff]"
  GET /financial/payments: "?page,pageSize,receivableId,dateFrom,dateTo,destinationBank -> PagedResult<PaymentResponse> [ClinicStaff]"
  POST /financial/payments: "{ receivableId, amount, paymentMethod, paidAt?, destinationBank?, fundsRecipient?, notes? } -> 201 PaymentResponse [ClinicStaff]"

  # Custom wrappers (not in openapi.json, available via src/services/api.ts):
  GET /financial/expenses: "?page,pageSize,categoryId,status,dateFrom,dateTo -> PagedResult<ExpenseResponse> [ClinicStaff]"
  POST /financial/expenses: "{ description, amount, categoryId, paymentMethod, paidAt?, status?, notes? } -> 201 ExpenseResponse [ClinicStaff]"
  PUT /financial/expenses/{id}: "{ ... } -> ExpenseResponse [ClinicStaff]"
  DELETE /financial/expenses/{id}: "-> 204 [ClinicAdminOrSecretary]"
  GET /financial/summary: "?destinationBank -> { grossReceived, totalReceived(recognized clinic revenue), professionalLiability, ownerReceivable, totalExpenses, balance(profit) } [ClinicStaff]"
  GET /financial/professional-settlements: "-> ProfessionalSettlementResponse[] grouped by professional [ClinicAdmin]"
  POST /financial/professional-settlements: "{ professionalId, throughDate?, paidAt? } -> settlement summary; marks all eligible liabilities paid [ClinicAdmin]"
  POST /financial/owner-settlements: "{ throughDate?, settledAt? } -> settlement summary; marks eligible Owner receipts transferred [ClinicAdmin]"

ExpenseCategories:
  GET /expense-categories: "?page,pageSize,search -> PagedResult<ExpenseCategoryResponse> [ClinicStaff]"
  POST /expense-categories: "{ name } -> 201 ExpenseCategoryResponse [ClinicAdminOrSecretary]"
  PUT /expense-categories/{id}: "{ name } -> ExpenseCategoryResponse [ClinicAdminOrSecretary]"
  DELETE /expense-categories/{id}: "-> 204 (soft delete; rejected while in use) [ClinicAdminOrSecretary]"

Dashboard:
  GET /dashboard/summary: "?doctorId? -> DashboardSummaryResponse [ClinicStaff]"

WhatsApp:
  POST /whatsapp/webhook: "{ clinicId?, appointmentId?, phone, message, providerMessageId? } [No auth]"

PatientPortal:
  POST /portal/auth: "{ cpf, accessToken } -> PatientPortalAuthResponse [No auth]"
  GET /portal/appointments: "-> PatientPortalAppointmentResponse[] [PatientPortal]"
  GET /portal/receivables: "-> PatientPortalReceivableResponse[] [PatientPortal]"

HealthInsurances:
  GET /health-insurances: "?page,pageSize,search -> PagedResult<HealthInsuranceResponse> [ClinicAdminOrSecretary]"
  POST /health-insurances: "{ name, phone?, contactName? } -> 201 HealthInsuranceResponse [ClinicAdminOrSecretary]"
  PUT /health-insurances/{id}: "{ name, phone?, contactName? } -> HealthInsuranceResponse [ClinicAdminOrSecretary]"
  DELETE /health-insurances/{id}: "-> 204 (soft delete) [ClinicAdminOrSecretary]"

Specialties:
  GET /specialties: "?page,pageSize,search -> PagedResult<SpecialtyResponse> (includes doctors list) [ClinicAdminOrSecretary]"
  POST /specialties: "{ name } -> 201 SpecialtyResponse [ClinicAdminOrSecretary]"
  PUT /specialties/{id}: "{ name } -> SpecialtyResponse [ClinicAdminOrSecretary]"
  DELETE /specialties/{id}: "-> 204 (soft delete) [ClinicAdminOrSecretary]"

DoctorAvailabilities:
  GET /doctor-availabilities: "?page,pageSize,doctorId -> PagedResult<DoctorAvailabilityResponse> [ClinicStaff]"
  POST /doctor-availabilities: "{ doctorId, dayOfWeek, startTime, endTime, isAvailable } -> 201 DoctorAvailabilityResponse [ClinicStaff]"
  PUT /doctor-availabilities/{id}: "{ dayOfWeek, startTime, endTime, isAvailable } -> DoctorAvailabilityResponse [ClinicStaff]"
  DELETE /doctor-availabilities/{id}: "-> 204 (soft delete) [ClinicStaff]"

Internal:
  POST /internal/clinics: "{ name, slug, timezone, businessHoursJson, cnpj?, email?, phone?, address?, adminName, adminEmail, adminPassword } -> ClinicProvisioningResponse [PlatformAdminOnly]"
  POST /internal/clinics/{id}/users: "{ name, email, password, role } -> UserResponse [PlatformAdminOnly]"

TenantSettings:
  GET /tenant/settings: "-> TenantSettingsResponse [ClinicStaff]"
  PUT /tenant/settings: "{ name, timezone, businessHoursJson, cnpj?, email?, phone?, address? } -> TenantSettingsResponse [Admin]"

ClinicalRecords:
  GET /appointments/{appointmentId}/clinical-record: "-> ClinicalRecordResponse [ClinicStaff]"
  POST /appointments/{appointmentId}/clinical-record: "{ chiefComplaint?, history?, physicalExam?, assessment?, plan? } -> 201 ClinicalRecordResponse [DoctorOnly]"
  PATCH /appointments/{appointmentId}/clinical-record: "{ chiefComplaint?, history?, physicalExam?, assessment?, plan? } -> ClinicalRecordResponse [DoctorOnly]"
  POST /appointments/{appointmentId}/clinical-record/finalize: "-> ClinicalRecordResponse [DoctorOnly]"
  POST /appointments/{appointmentId}/clinical-record/addendum: "{ content } -> 201 ClinicalRecordAddendumResponse [DoctorOnly]"
  GET /appointments/{appointmentId}/clinical-record/addendums: "-> ClinicalRecordAddendumResponse[] [ClinicStaff]"
  GET /patients/{patientId}/clinical-records: "-> ClinicalRecordResponse[] [ClinicStaff]"

PaymentIntents:
  POST /payment-intents: "{ receivableId, amount, idempotencyKey } -> PaymentIntentResponse [ClinicStaff]"
  GET /payment-intents: "?page,pageSize,receivableId,status -> PagedResult<PaymentIntentResponse> [ClinicStaff]"
  POST /payment-intents/{id}/confirm: "-> PaymentIntentResponse [ClinicAdmin]"
  POST /payment-intents/{id}/cancel: "-> PaymentIntentResponse [ClinicAdmin]"

TenantIntegration:
  GET /tenant/integration: "-> TenantIntegrationResponse (all configs) [ClinicAdmin]"
  PUT /tenant/integration/whatsapp: "{ phoneNumberOfId, accessToken, wABAId?, isEnabled } -> WhatsAppConfigResponse [ClinicAdmin]"
  PUT /tenant/integration/payment-gateway: "{ provider, apiKey?, secret?, environment, webhookSecret?, isEnabled } -> PaymentGatewayConfigResponse [ClinicAdmin]"
  PUT /tenant/integration/notification: "{ reminderHoursBefore, channelsJson, quietHoursStart?, quietHoursEnd?, enableAutoReminders } -> NotificationConfigResponse [ClinicAdmin]"
  PUT /tenant/integration/branding: "{ logoUrl?, primaryColor?, secondaryColor?, customClinicName? } -> BrandingResponse [ClinicAdmin]"

PaymentWebhooks:
  POST /webhooks/payments/{provider}: "Generic webhook receiver for any payment gateway. Headers: X-Clinic-Id, X-Hub-Signature-256|X-Signature. Body: gateway-specific JSON. Returns 200 OK on success. [No auth, HMAC verified]"

SignalR:
  Hub: /hubs/payments (JWT auth, ClinicStaff policy)
  Client method: JoinClinicGroup(clinicId) / LeaveClinicGroup(clinicId)
  Server event: PaymentStatusChanged { Id, Status, GatewayReference, Amount }

WhatsAppMessaging:
  # Outbound via Meta Cloud API (service-level, not exposed as REST endpoints)
  # WhatsAppMessagingService.SendTextAsync(clinicId, phone, text)
  # WhatsAppMessagingService.SendTemplateAsync(clinicId, phone, templateName, languageCode, parameters?)
  # WhatsAppMessagingService.SendAppointmentConfirmationAsync(appointment, patient)
  # WhatsAppMessagingService.SendAppointmentCancellationAsync(appointment, patient)
