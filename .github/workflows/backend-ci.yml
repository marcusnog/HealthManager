name: backend-ci

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HealthManager.sln

      - name: Build
        run: dotnet build HealthManager.sln --no-restore --configuration Release

      - name: Verify EF migration snapshot
        run: dotnet tool restore && dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/HealthManager.Infrastructure --startup-project src/HealthManager.Api --context HealthManager.Infrastructure.Persistence.AppDbContext --no-build --configuration Release

      - name: Test
        run: dotnet test HealthManager.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Generate coverage report
        run: dotnet tool run reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"CoverageReport" -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"

      - name: Publish coverage summary
        if: always()
        run: cat CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            TestResults/**
            CoverageReport/**

  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    concurrency:
      group: backend-production
      cancel-in-progress: false
    env:
      RELEASE: ${{ github.sha }}
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VPS access
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        run: |
          tar --exclude=.git --exclude=bin --exclude=obj --exclude=tmp --exclude=TestResults --exclude=CoverageReport -czf /tmp/healthmanager.tar.gz .
          scp /tmp/healthmanager.tar.gz root@157.254.207.208:/tmp/healthmanager.tar.gz

      - name: Deploy to VPS
        run: |
          ssh root@157.254.207.208 bash -s -- "$RELEASE" <<'REMOTE'
          set -euo pipefail
          release="$1"
          test -f /opt/healthmanager/.env
          install -d -o 1654 -g 1654 /opt/healthmanager-data
          release_dir="/opt/healthmanager-releases/$release"
          install -d "$release_dir"
          tar -xzf /tmp/healthmanager.tar.gz -C "$release_dir"
          rm /tmp/healthmanager.tar.gz
          cd "$release_dir"
          if command -v k3s >/dev/null && k3s kubectl -n healthmanager get deployment api worker >/dev/null 2>&1; then
            docker build -f Dockerfile.api -t "localhost/healthmanager-api:$release-k3s" .
            docker build -f Dockerfile.worker -t "localhost/healthmanager-worker:$release-k3s" .
            docker save "localhost/healthmanager-api:$release-k3s" "localhost/healthmanager-worker:$release-k3s" | k3s ctr images import -
            k3s kubectl -n healthmanager set image deployment/api "api=localhost/healthmanager-api:$release-k3s"
            k3s kubectl -n healthmanager set image deployment/worker "worker=localhost/healthmanager-worker:$release-k3s"
            if ! k3s kubectl -n healthmanager rollout status deployment/api --timeout=180s ||
               ! k3s kubectl -n healthmanager rollout status deployment/worker --timeout=180s; then
              k3s kubectl -n healthmanager rollout undo deployment/api
              k3s kubectl -n healthmanager rollout undo deployment/worker
              exit 1
            fi
          else
            docker compose --project-name healthmanager --env-file /opt/healthmanager/.env -f docker-compose.vps.yml up -d --build --remove-orphans
          fi
          REMOTE

      - name: Verify API
        run: |
          ssh root@157.254.207.208 bash -s <<'REMOTE'
          set -euo pipefail
          if command -v k3s >/dev/null && k3s kubectl -n healthmanager get deployment api >/dev/null 2>&1; then
            pod="$(k3s kubectl -n healthmanager get pods -l app=api -o jsonpath='{.items[0].metadata.name}')"
            k3s kubectl -n healthmanager port-forward "pod/$pod" 18080:8080 >/tmp/healthmanager-health-check.log 2>&1 &
            forward_pid=$!
            trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
            for attempt in {1..12}; do
              curl --fail --silent --show-error http://127.0.0.1:18080/health && exit 0
              sleep 5
            done
          else
            for attempt in {1..12}; do
              curl --fail --silent --show-error http://127.0.0.1:8080/health && exit 0
              sleep 5
            done
          fi
          exit 1
          REMOTE
