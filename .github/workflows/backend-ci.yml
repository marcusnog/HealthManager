name: backend-ci

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HealthManager.sln

      - name: Build
        run: dotnet build HealthManager.sln --no-restore --configuration Release

      - name: Verify EF migration snapshot
        run: dotnet tool restore && dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/HealthManager.Infrastructure --startup-project src/HealthManager.Api --context HealthManager.Infrastructure.Persistence.AppDbContext --no-build --configuration Release

      - name: Test
        run: dotnet test HealthManager.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Generate coverage report
        run: dotnet tool run reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"CoverageReport" -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"

      - name: Publish coverage summary
        if: always()
        run: cat CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            TestResults/**
            CoverageReport/**

  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VPS access
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        run: |
          tar --exclude=.git --exclude=bin --exclude=obj --exclude=tmp --exclude=TestResults --exclude=CoverageReport -czf /tmp/healthmanager.tar.gz .
          scp /tmp/healthmanager.tar.gz root@157.254.207.208:/tmp/healthmanager.tar.gz

      - name: Deploy to VPS
        run: |
          ssh root@157.254.207.208 '
            set -eu
            test -f /opt/healthmanager/.env
            install -d -o 1654 -g 1654 /opt/healthmanager-data
            find /opt/healthmanager -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf -- {} +
            tar -xzf /tmp/healthmanager.tar.gz -C /opt/healthmanager
            rm /tmp/healthmanager.tar.gz
            cd /opt/healthmanager
            docker compose --env-file .env -f docker-compose.vps.yml up -d --build --remove-orphans
            docker image prune -f
          '

      - name: Verify API
        run: |
          for attempt in {1..12}; do
            curl --fail --silent --show-error http://157.254.207.208:8080/health && exit 0
            sleep 5
          done
          exit 1
