# Controlled migration from a MedX export. Existing entity rules remain canonical.
source:
  format: "Encrypted JSONdata ZIP plus numbered medxdata ZIPs. Source files are never modified."
  identity: "MedX subscription + table + source record ID; file provenance includes archive and member name."
preparation:
  command: "python scripts/medx_prepare.py --source <directory> --output <new private directory> --subscription <id>"
  password: "Read MEDX_BACKUP_PASSWORD from the process environment or prompt; never persist it in code, reports or version control."
  output: "Offline staging only. No database, HTTP requests, notifications, payments, user activation or portal credentials. Patient data must remain outside the repository."
  duplicates: "Duplicate ZIP copies are excluded only after SHA-256 equality. Duplicate source IDs and CPFs are held for review, never merged by name."
  patients: "Prepare CreatePatientRequest-compatible fields. Normalize CPF digits and validate check digits; a supplied invalid CPF blocks that row rather than silently clearing it. Missing CPF/phone stays empty. Preserve the full original contact alongside its candidate payload."
  contact_details: "Map explicit residential address, social name, RG, family/contact fields, profession and observations. Referral IDs require contact lookup; zero is no referral. Preserve unknown source fields in original tables rather than guessing."
  unresolved: "Missing/invalid source ID, name, birth date, phone, sex or duplicate identity blocks the patient candidate. Issues identify source IDs, not clinical text."
  history: "Preserve source text, date, author ID, class and original row. No synthetic appointments, professional attribution, finalization or signatures. Native clinical records require verified appointment/doctor mapping."
  documents: "Inventory original filenames, sizes and CRC. Resolve only exact filenames referenced by the history Classe field; do not attach by name similarity or patient name. Empty files and files larger than the 10 MiB upload limit remain pending. Execution must also account for multipart request overhead."
  unsupported: "Financial states, appointment statuses/timezones, professionals, catalog content and account permissions require explicit mappings. Retain all source JSON tables; no guessed financial entries or copied credentials."
execution:
  transport: "Use HTTPS by default. For bulk migration, a loopback HTTP connection may use a separately established SSH tunnel pinned to the verified VPS host key and restricted to the confirmed HealthManager web/API service. Retain the canonical HTTPS destination in journals, validate clinic identity through the API, keep private keys outside Git, and remove temporary forwarding access after the migration. Never disable TLS certificate verification."
  document_phase: "Copy only exact linked original PDF/JPEG/PNG bytes to journal-owned, API-verified patients. Hold filenames referenced by different source patients, missing/empty/oversized files and unsupported formats. Require persistent storage and a verified server backup. Check archive hash, member CRC/size, multipart request size, destination clinic/patient path, and SHA-256 either by downloaded copy or independent server-side read of the persisted file matched to its database row. Server-verification mode records uploaded (unverified) until the encrypted integrity report is reconciled locally. Record intent and verified document ID durably; reconcile uncertain uploads by exact filename and bytes, never blindly retry. No invented clinical record, signature or physician attribution."
  verified_deleted_identities: "A recent verified server backup and a clinic-scoped export of deleted identities unlock patients without CPF. Check both active and deleted names/CPFs; never recreate deleted patients automatically. Encrypted transport only; decrypt locally outside repositories."
  catalog_phase: "Create only unambiguous active professionals and positive-priced procedures. Do not create user accounts or copy passwords: doctor email is omitted to avoid the API's account-creation side effect. Preserve existing names, registrations, prices and financial splits. Procedures map to the application's sellable application catalog with source price and session count; no balance grants or stock movements."
  exam_templates: "Import named, visible exam models as shared Exam catalog items. Compose the displayed unit from the explicit Peso/Volume pair when both are present; preserve spelling/case and do not convert numeric values. A denominator without a numerator requires review. Copy sex-specific reference ranges as text, labeled as legacy values; do not turn them into automated diagnostic thresholds. Use a dedicated MedX folder and persisted source mapping."
  exam_unit_correction: "Correct incomplete units only on journal-owned exam models that still exactly match their first complete post-import snapshot, including revision. Change only the unit and its descriptive line, preserving every other field and reference value. Save durable before/expected/after evidence, use optimistic concurrency, and reconcile an uncertain update against the complete expected snapshot before any retry. Never overwrite independent edits."
  document_templates: "Only explicitly shared models whose full ancestor chain is shared may become shared Document catalog entries. Convert simple HTML into plain text, retaining paragraph and list order and source provenance. Hold private/unknown ownership, hidden or rich markup, RTF, legacy placeholders, invalid hierarchy and over-limit content without truncation. Label converted formatting for review; never execute embedded instructions or scripts."
  appointment_types: "Diagnóstico-QP defines legacy appointment types. Create valid names only after checking active and deleted target types; link an exact normalized active name, never infer aliases. Preserve source duration in the private mapping because target types have no duration field. This does not create appointments or infer statuses/timezones. The legacy Particular payer is self-pay information, not a newly invented insurer."
  destination: "An explicitly identified clinic and environment are required before any write."
  expense_categories: "Only subgroups whose explicit parent group has type Despesas become expense categories. Hold missing/unknown/revenue parents, invalid or duplicate source identities, duplicate normalized names and deleted destination names. Link only an exact normalized active name. Preserve the original parent group in the private mapping; never create expenses, payments, receivables or balances from these lookups."
  preflight: "Compare candidates with destination patients; never merge automatically. The API-only first phase imports only valid non-empty CPF: the database unique clinic/CPF index includes soft-deleted rows and rejects those conflicts. Patients without CPF remain held until deleted identities can be inspected. Existing CPF or matching normalized name blocks creation."
  repeatability: "Applying must persist a clinic-scoped source-to-target mapping and reconcile uncertain outcomes before retry. No automatic overwriting of existing records."
  backup: "The append-only patient phase saves and hashes a complete active-patient API snapshot before writes; it never updates or deletes existing rows. This is not a full database backup. Any broader migration requires a verified database backup. Report created, matched, held and failed counts."
  patient_phase: "HTTPS and explicit clinic ID/name required; verify login and tenant settings. Persist a source marker in notes plus a durable local journal before and after POST. On uncertain outcome stop; resume only when the marker resolves to exactly one unchanged patient. No automatic retry of an uncertain creation."
  reconciliation: "An interrupted CPF-based creation may be explicitly reclassified after the original process has ended, request timeout has elapsed, and a fresh complete tenant snapshot proves neither its source marker nor CPF exists. Save the evidence and retry in an isolated one-record batch; the clinic/CPF database constraint remains the final protection."
  pilot_enrichment: "Completing fields on the first pilot batch is allowed only for journal-owned target IDs whose current identity, notes and all editable fields still match the original prepared payload. Save before/after snapshots and migration provenance. Never overwrite independent edits or pre-existing patients."
