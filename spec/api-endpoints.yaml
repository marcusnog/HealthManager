# Canonical API endpoints — source of truth.
# Full contract: docs/openapi.json
# Auth header: Bearer {accessToken}, except endpoints explicitly marked [No auth].

WorkerObservability:
  GET /metrics: "Worker-only listener on WORKER_METRICS_URL (default http://+:9091); Prometheus process uptime, CPU seconds and resident memory. Internal cluster monitoring only; not served by the API. [No auth]"

Auth:
  POST /auth/login: "{ email, password } -> AuthResponse"
  POST /auth/refresh: "{ refreshToken } -> AuthResponse"
  POST /auth/logout: "{ refreshToken } -> 204"
  POST /auth/change-password: "{ currentPassword, newPassword } -> 204 [Auth required]"

Patients:
  GET /patients: "?page,pageSize,search,sortBy,sortDirection,email,healthInsurance -> PagedResult<PatientResponse> [ClinicAdminOrSecretary]"
  POST /patients: "{ identification (cpf optional; sex: Masculino|Feminino|Prefiro não informar), insurance/marketing, contacts (phone optional), address, complementary data, notes } -> 201 PatientResponse [ClinicAdminOrSecretary]"
  PATCH /patients/{id}: "{ all editable patient fields; phone optional; cpf remains immutable } -> PatientResponse [ClinicAdminOrSecretary]"
  DELETE /patients/{id}: "-> 204 (soft delete, audit logged); 400 when a non-cancelled receivable has outstanding balance [ClinicAdmin]"
  POST /patients/{id}/access-token/regenerate: "-> new Guid (regenerates patientAccessToken) [ClinicAdminOrSecretary]"
  GET /address/cep/{cep}: "-> CepAddressResponse via ViaCEP [ClinicAdminOrSecretary]"
  # Documents:
  GET /patients/{id}/documents: "-> PatientDocumentResponse[] [ClinicStaff]"
  POST /patients/{id}/documents/upload: "multipart -> 201 PatientDocumentResponse [ClinicStaff]"
  GET /patients/{id}/documents/{docId}/download: "-> file stream [ClinicStaff]"
  DELETE /patients/{id}/documents/{docId}: "-> 204 (soft delete, audit logged) [ClinicStaff]"

Doctors:
  GET /doctors: "?page,pageSize,search,sortBy,sortDirection -> PagedResult<DoctorResponse> (includes Specialties list) [ClinicAdminOrSecretary]"
  POST /doctors: "{ name, crm, phone?, email?, clinicSharePercentage, specialtyIds } -> 201 DoctorResponse [ClinicAdminOrSecretary]"
  PUT /doctors/{id}: "{ name, phone?, email?, isActive, clinicSharePercentage, specialtyIds } -> DoctorResponse [ClinicAdminOrSecretary]"
  # specialtyIds: omitted/null preserves current links; [] removes all; a list replaces the selection.
  DELETE /doctors/{id}: "-> 204 (soft delete, audit logged) [ClinicAdminOrSecretary]"

Appointments:
  GET /appointments: "?page,pageSize,date,dateFrom,dateTo,doctorId,status -> PagedResult<AppointmentResponse> [ClinicStaff]"
  POST /appointments: "{ patientId, doctorId, startAt, durationMinutes, notes?, appointmentTypeId, amount } -> 201 AppointmentResponse [ClinicStaff]"
  POST /appointments/group: "{ patientIds (distinct, min 2), doctorId, startAt, durationMinutes, notes?, appointmentTypeId, amount } -> 201 AppointmentResponse[] (atomic; shared appointmentGroupId) [ClinicStaff]"
  PATCH /appointments/{id}: "{ doctorId?, startAt?, durationMinutes?, notes?, appointmentTypeId?, amount? } -> AppointmentResponse [ClinicStaff]"
  DELETE /appointments/{id}: "-> 204 (soft delete, cancel unpaid receivable, audit; 400 for clinical record/payment/active checkout, 404 if missing) [ClinicStaff]"
  PATCH /appointments/{id}/status: "{ status: AppointmentStatus } -> AppointmentResponse (audited correction; preserves payments and clinical records) [ClinicStaff]"
  POST /appointments/{id}/confirm: "-> AppointmentResponse [ClinicStaff]"
  POST /appointments/{id}/cancel: "-> AppointmentResponse (also cancels receivable if not Paid) [ClinicStaff]"
  POST /appointments/{id}/in-progress: "-> AppointmentResponse [ClinicStaff]"
  POST /appointments/{id}/complete: "-> AppointmentResponse [ClinicStaff]"
  POST /appointments/{id}/no-show: "-> AppointmentResponse [ClinicStaff]"

AppointmentTypes:
  GET /appointment-types: "?page,pageSize,search -> PagedResult<AppointmentTypeResponse> [ClinicStaff]"
  POST /appointment-types: "{ name } -> 201 AppointmentTypeResponse [ClinicAdminOrSecretary]"
  PUT /appointment-types/{id}: "{ name } -> AppointmentTypeResponse [ClinicAdminOrSecretary]"
  DELETE /appointment-types/{id}: "-> 204 (soft delete; rejected while in use) [ClinicAdminOrSecretary]"

Financial:
  DELETE /financial/payments/{id}: "-> 204 (soft delete, audit and balance recalculation); 400 if settled, 409 on concurrent changes [FinanceReceivablesManage]"
  # Policies: FinanceCategoriesView/Manage, FinanceReceivablesView/Manage, FinancePayablesView/Manage,
  # FinanceSummaryView, FinanceSettlements — permissions carried as JWT 'permission' claims.
  # View policies accept view or manage permission; Manage policies require manage only.
  # Admin: all. Secretary: categories+receivables manage, payables view, summary view. Doctor: receivables/summary view.
  GET /financial/receivables: "?page,pageSize,status,dateFrom,dateTo -> PagedResult<ReceivableResponse> (includes linked appointment date, type, status and doctor) [FinanceReceivablesView]"
  GET /financial/payments: "?page,pageSize,receivableId,dateFrom,dateTo,destinationBank -> PagedResult<PaymentResponse> [FinanceReceivablesView]"
  POST /financial/payments: "{ receivableId, amount, paymentMethod, paidAt?, destinationBank?, fundsRecipient?, notes? } -> 201 PaymentResponse [FinanceReceivablesManage]"
  POST /financial/receivables/manual: "{ patientId?, description?, amount, dueDate?, paymentMethod, paidAt?, destinationBank?, fundsRecipient?, notes? } -> 201 ReceivableResponse (patient link, no appointment) [FinanceReceivablesManage]"

  # Custom wrappers (not in openapi.json, available via src/services/api.ts):
  GET /financial/expenses: "?page,pageSize,categoryId,status,dateFrom,dateTo -> PagedResult<ExpenseResponse> [FinancePayablesView]"
  POST /financial/expenses: "{ description, amount, categoryId, paymentMethod, paidAt?, status?, notes? } -> 201 ExpenseResponse [FinancePayablesManage]"
  PUT /financial/expenses/{id}: "{ ... } -> ExpenseResponse [FinancePayablesManage]"
  DELETE /financial/expenses/{id}: "-> 204 [FinancePayablesManage]"
  GET /financial/summary: "?destinationBank -> { grossReceived, totalReceived(recognized clinic revenue), professionalLiability, ownerReceivable, totalExpenses, balance(profit) } [FinanceSummaryView]"
  GET /financial/professional-settlements: "-> ProfessionalSettlementResponse[] grouped by professional, pending items and settledItems with professionalPaidAt for reports [FinanceSettlements]"
  POST /financial/professional-settlements: "{ professionalId, paymentIds?, throughDate?, paidAt? } -> settlement summary; marks selected eligible liabilities paid (paymentIds omitted preserves settle-through-date behavior) [FinanceSettlements]"
  POST /financial/owner-settlements: "{ throughDate?, settledAt? } -> settlement summary; marks eligible Owner receipts transferred [FinanceSettlements]"

ExpenseCategories:
  GET /expense-categories: "?page,pageSize,search -> PagedResult<ExpenseCategoryResponse> [FinanceCategoriesView]"
  POST /expense-categories: "{ name } -> 201 ExpenseCategoryResponse [FinanceCategoriesManage]"
  PUT /expense-categories/{id}: "{ name } -> ExpenseCategoryResponse [FinanceCategoriesManage]"
  DELETE /expense-categories/{id}: "-> 204 (soft delete; rejected while in use) [FinanceCategoriesManage]"

Products:
  GET /products: "?page,pageSize,search -> PagedResult<ProductResponse> [ClinicStaff]"
  POST /products: "{ name, price, applicationCount, isActive? } -> 201 ProductResponse [ClinicAdminOrSecretary]"
  PUT /products/{id}: "{ name, price, applicationCount, isActive? } -> ProductResponse [ClinicAdminOrSecretary]"
  DELETE /products/{id}: "-> 204 (soft delete; rejected while used by a package) [ClinicAdminOrSecretary]"

Packages:
  GET /packages: "?page,pageSize,search -> PagedResult<PackageResponse> [ClinicStaff]"
  POST /packages: "{ name, price, isActive?, items: [{ productId, applicationCount }] } -> 201 PackageResponse [ClinicAdminOrSecretary]"
  PUT /packages/{id}: "{ name, price, isActive?, items: [{ productId, applicationCount }] } -> PackageResponse [ClinicAdminOrSecretary]"
  DELETE /packages/{id}: "-> 204 (soft delete with its items) [ClinicAdminOrSecretary]"

PatientApplications:
  GET /patients/{id}/applications/balance: "-> PatientApplicationBalanceResponse[] { product, source, package?, purchased, used, remaining } [ClinicStaff]"
  POST /patients/{id}/applications/balance: "{ source: package|individual, packageId?, productId? } -> 201 PatientApplicationBalanceResponse[] (grants purchased units) [ClinicAdminOrSecretary]"
  GET /patients/{id}/applications: "-> PatientApplicationResponse[] (sessions, newest first) [ClinicStaff]"
  POST /patients/{id}/applications: "{ productId, quantity?, appliedAt?, doctorId?, notes?, balanceId? } -> 201 PatientApplicationResponse (consumes balance) [DoctorOnly]"

Dashboard:
  GET /dashboard/summary: "?doctorId? -> DashboardSummaryResponse [ClinicStaff]"

WhatsApp:
  GET /whatsapp/webhook: "Meta verification challenge (?hub.mode,hub.verify_token,hub.challenge) [No auth]"
  POST /whatsapp/webhook: "Native Meta envelope; mandatory X-Hub-Signature-256 HMAC, tenant from metadata.phone_number_id; 200 accepted, 400 malformed, 401 signature invalid, 503 missing server secret [No JWT; see atendimento.yaml]"
  GET /whatsapp/conversations: "?page,pageSize,search -> PagedResult<WhatsAppConversationResponse> [ClinicAdminOrSecretary]"
  GET /whatsapp/conversations/{phone}/messages: "?page=1,pageSize=50 -> PagedResult<WhatsAppMessageResponse> newest first; without either pagination parameter, legacy chronological array (latest 50) during rollout [ClinicAdminOrSecretary]"
  POST /whatsapp/conversations/{phone}/messages: "{ message, clientRequestId? } -> WhatsAppMessageResponse; Pending for unknown delivery, Failed for explicit rejection; same request id returns original attempt [ClinicAdminOrSecretary]"

PatientPortal:
  POST /portal/auth: "{ cpf, accessToken } -> PatientPortalAuthResponse [No auth]"
  GET /portal/me: "-> PatientPortalProfileResponse [PatientPortal]"
  GET /portal/appointments: "-> PatientPortalAppointmentResponse[] [PatientPortal]"
  GET /portal/receivables: "-> PatientPortalReceivableResponse[] (patient's appointment-linked and manual receipts) [PatientPortal]"
  GET /portal/documents: "-> PatientDocumentResponse[] [PatientPortal]"

Checkout:
  POST /checkout: "{ receivableId, paymentMethod, amount?, returnUrl? } -> 201 CheckoutResponse [ClinicStaff]"
  POST /portal/checkout: "{ receivableId, paymentMethod, amount?, returnUrl? } -> 201 CheckoutResponse [PatientPortal]"
  GET /checkout/{paymentIntentId}: "-> CheckoutResponse [ClinicStaff]"

HealthInsurances:
  GET /health-insurances: "?page,pageSize,search -> PagedResult<HealthInsuranceResponse> [ClinicAdminOrSecretary]"
  POST /health-insurances: "{ name, phone?, contactName? } -> 201 HealthInsuranceResponse [ClinicAdminOrSecretary]"
  PUT /health-insurances/{id}: "{ name, phone?, contactName? } -> HealthInsuranceResponse [ClinicAdminOrSecretary]"
  DELETE /health-insurances/{id}: "-> 204 (soft delete) [ClinicAdminOrSecretary]"

Specialties:
  GET /specialties: "?page,pageSize,search -> PagedResult<SpecialtyResponse> (includes doctors list) [ClinicAdminOrSecretary]"
  POST /specialties: "{ name } -> 201 SpecialtyResponse [ClinicAdminOrSecretary]"
  PUT /specialties/{id}: "{ name } -> SpecialtyResponse [ClinicAdminOrSecretary]"
  DELETE /specialties/{id}: "-> 204 (soft delete) [ClinicAdminOrSecretary]"

DoctorAvailabilities:
  GET /doctor-availabilities: "?page,pageSize,doctorId -> PagedResult<DoctorAvailabilityResponse> [ClinicStaff]"
  POST /doctor-availabilities: "{ doctorId, dayOfWeek, startTime, endTime, isAvailable } -> 201 DoctorAvailabilityResponse [ClinicStaff]"
  PUT /doctor-availabilities/{id}: "{ dayOfWeek, startTime, endTime, isAvailable } -> DoctorAvailabilityResponse [ClinicStaff]"
  DELETE /doctor-availabilities/{id}: "-> 204 (soft delete) [ClinicStaff]"

Internal:
  POST /internal/clinics: "{ name, slug, timezone, businessHoursJson, cnpj?, email?, phone?, address?, adminName, adminEmail, adminPassword } -> ClinicProvisioningResponse [PlatformAdminOnly]"
  POST /internal/clinics/{id}/users: "{ name, email, password, role } -> UserResponse [PlatformAdminOnly]"

TenantSettings:
  GET /tenant/settings: "-> TenantSettingsResponse [ClinicStaff]"
  PUT /tenant/settings: "{ name, timezone, businessHoursJson, cnpj?, email?, phone?, address? } -> TenantSettingsResponse [Admin]"

ClinicalRecords:
  GET /appointments/{appointmentId}/clinical-record: "-> ClinicalRecordResponse [ClinicStaff]"
  POST /appointments/{appointmentId}/clinical-record: "{ chiefComplaint?, history?, physicalExam?, assessment?, plan?, content?, prescription? } -> 201 ClinicalRecordResponse [ClinicAdminOrDoctor]"
  PATCH /appointments/{appointmentId}/clinical-record: "{ chiefComplaint?, history?, physicalExam?, assessment?, plan?, content?, prescription? } -> ClinicalRecordResponse [ClinicAdminOrDoctor]"
  POST /appointments/{appointmentId}/clinical-record/finalize: "-> ClinicalRecordResponse [DoctorOnly]"
  POST /appointments/{appointmentId}/clinical-record/addendum: "{ content } -> 201 ClinicalRecordAddendumResponse [DoctorOnly]"
  GET /appointments/{appointmentId}/clinical-record/addendums: "-> ClinicalRecordAddendumResponse[] [ClinicStaff]"
  GET /patients/{patientId}/clinical-records: "-> ClinicalRecordResponse[] [ClinicStaff]"

PaymentIntents:
  POST /payment-intents: "{ receivableId, amount, idempotencyKey } -> PaymentIntentResponse [ClinicStaff]"
  GET /payment-intents: "?page,pageSize,receivableId,status -> PagedResult<PaymentIntentResponse> [ClinicStaff]"
  POST /payment-intents/{id}/confirm: "-> PaymentIntentResponse [ClinicAdmin]"
  POST /payment-intents/{id}/cancel: "-> PaymentIntentResponse [ClinicAdmin]"

TenantIntegration:
  GET /tenant/integration: "-> TenantIntegrationResponse (all configs) [ClinicAdmin]"
  PUT /tenant/integration/whatsapp: "{ phoneNumberOfId, accessToken, wABAId?, isEnabled } -> WhatsAppConfigResponse [ClinicAdmin]"
  PUT /tenant/integration/payment-gateway: "{ provider, apiKey?, secret?, environment, webhookSecret?, isEnabled } -> PaymentGatewayConfigResponse [ClinicAdmin]"
  PUT /tenant/integration/notification: "{ reminderHoursBefore, channelsJson, quietHoursStart?, quietHoursEnd?, enableAutoReminders } -> NotificationConfigResponse [ClinicAdmin]"
  PUT /tenant/integration/branding: "{ logoUrl?, primaryColor?, secondaryColor?, customClinicName? } -> BrandingResponse [ClinicAdmin]"

PaymentWebhooks:
  POST /webhooks/payments/{provider}: "Generic webhook receiver for any payment gateway. Headers: X-Clinic-Id, X-Hub-Signature-256|X-Signature. Body: gateway-specific JSON. Returns 200 OK on success. [No auth, HMAC verified]"

SignalR:
  Hub: /hubs/payments (JWT auth, ClinicStaff and FinanceReceivablesView policies)
  Client method: JoinClinicGroup(clinicId) / LeaveClinicGroup(clinicId)
  Server event: PaymentStatusChanged { Id, Status, GatewayReference, Amount }

System:
  GET /health: "ASP.NET Core health check [No auth]"

WhatsAppMessaging:
  # Outbound via Meta Cloud API (service-level, not exposed as REST endpoints)
  # WhatsAppMessagingService.SendTextAsync(clinicId, phone, text)
  # WhatsAppMessagingService.SendTemplateAsync(clinicId, phone, templateName, languageCode, parameters?)
  # WhatsAppMessagingService.SendAppointmentConfirmationAsync(appointment, patient)
  # WhatsAppMessagingService.SendAppointmentCancellationAsync(appointment, patient)
  # Requires ClinicWhatsAppConfig with IsEnabled=true for the clinic
  # Messages stored as WhatsAppMessage (direction=Outbound) and enqueued via outbox

Users:
  GET /users: "-> ManagedUserResponse[] of own clinic [ClinicAdmin]"
  GET /users/access-profiles: "-> AccessProfileResponse[] with role, availableScreens and defaultScreens [ClinicAdmin]"
  POST /users: "{ name, email, password, role, screens? } -> 201 ManagedUserResponse [ClinicAdmin]"
  PUT /users/{id}: "{ name, email, role, isActive, screens? } -> ManagedUserResponse [ClinicAdmin]; own account cannot be demoted/deactivated"

ClinicalWorkspace:
  GET /clinical-catalog: "?kind,search -> ClinicalCatalogResponse[] (max 1000; filter search) [Admin/Doctor; shared+own]"
  POST /clinical-catalog: "SaveClinicalCatalogRequest -> 201 ClinicalCatalogResponse [Admin/Doctor]"
  PUT /clinical-catalog/{id}: "SaveClinicalCatalogRequest (revision required) -> ClinicalCatalogResponse [Admin/Doctor; shared+own; conflict 409]"
  DELETE /clinical-catalog/{id}: "?revision -> 204 (soft delete; conflict 409) [Admin/Doctor; shared+own]"
  GET /appointments/{appointmentId}/clinical-entries: "-> ClinicalEntryResponse[] (appointment entries) [ClinicStaff; owning Doctor]"
  POST /appointments/{appointmentId}/clinical-entries: "CreateClinicalEntryRequest -> 201 ClinicalEntryResponse [ClinicAdminOrDoctor; Admin or owning Doctor; Draft]"
  GET /patients/{patientId}/clinical-entries: "?page=1,pageSize=50,kind? -> PagedResult<ClinicalEntryResponse> [ClinicStaff; Doctor own entries only]"
