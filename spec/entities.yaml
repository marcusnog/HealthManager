# Canonical entity definitions — source of truth.
# ClinicalCatalogItem / ClinicalEntry are defined below and detailed in clinical-workspace.yaml.
# Backend: HealthManager.Domain/Model.cs.
# Frontend: src/generated/models/ (regenerated from openapi.json).

- Clinic:
  id: Guid (auto)
  slug: string, unique index
  name: string
  timezone: string (default America/Sao_Paulo)
  businessHoursJson: string (JSON `{start, end}`)
  cnpj: string?
  email: string?
  phone: string?
  address: string?
  defaultAppointmentMinutes: int (default 30)
  status: ClinicStatus (Active|Suspended)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

  # General tenant settings are stored directly on Clinic. Do not create a
  # generic key/value settings entity until a setting has no natural owner.

- User:
  id: Guid (auto)
  clinicId: Guid? (null for PlatformAdmin)
  name: string
  email: 'string, unique index (filter: DeletedAt IS NULL)'
  passwordHash: string (BCrypt)
  screenAccessJson: string? (JSON array of screen keys; null uses role defaults; empty array denies all screens; Admin always has all screens)
  role: UserRole (PlatformAdmin|Admin|Secretary|Doctor|Patient; Secretary is displayed as Recepção)
  isActive: bool (default true)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- Patient:
  id: Guid (auto)
  clinicId: Guid
  name: string
  socialName: string?
  cpf: 'string (optional at registration; empty string when absent; unique per clinic for non-empty CPF, validated with check digits when supplied)'
  rg: string?
  birthDate: DateOnly?
  sex: string? (Masculino|Feminino|Prefiro não informar)
  phone: string (optional at registration; empty string when absent)
  secondaryPhone: string?
  commercialPhone: string?
  contactName: string?
  email: string?
  healthInsurance: string? (free-text, legacy field)
  healthInsuranceId: Guid? (FK HealthInsurance)
  medicalRecordNumber: string (auto, immutable, format `P-{first 12 uppercase hex digits of id}`)
  healthInsuranceNumber: string?
  cns: string?
  isVip: bool
  excludeFromMarketing: bool
  receiveDirectMail: bool
  tags: string?
  zipCode: string?
  street: string?
  complement: string?
  neighborhood: string?
  city: string?
  state: string?
  region: string?
  company: string?
  reference: string?
  acquisitionSource: string?
  referredBy: string?
  maritalStatus: string?
  education: string?
  profession: string?
  religion: string?
  fatherName: string?
  motherName: string?
  companionName: string?
  childrenCount: int?
  spouseName: string?
  notes: string?
  patientAccessToken: Guid (auto, used for portal auth)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- Doctor:
  id: Guid (auto)
  clinicId: Guid
  name: string
  crm: 'string (unique per clinic: clinicId+crm index)'
  phone: string?
  email: string?
  isActive: bool (default true)
  clinicSharePercentage: decimal (0..100, default 100; clinic's retained share)
  doctorSpecialties: '[DoctorSpecialty] (many-to-many via Specialty)'
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- Appointment:
  id: Guid (auto)
  clinicId: Guid
  appointmentGroupId: Guid? (shared by appointments created together; null for individual appointments)
  patientId: Guid (FK Patient)
  doctorId: Guid (FK Doctor)
  startAt: DateTimeOffset (UTC)
  endAt: DateTimeOffset (UTC)
  status: AppointmentStatus (Scheduled|Confirmed|Cancelled|Completed|NoShow|InProgress)
  confirmationStatus: ConfirmationStatus (Pending|Confirmed|Declined)
  source: AppointmentSource (Internal|WhatsApp)
  appointmentTypeId: Guid (FK AppointmentType)
  notes: string?
  amount: decimal (0 = no charge)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- AppointmentType:
  id: Guid (auto)
  clinicId: Guid
  name: 'string (unique per clinic: clinicId+name index)'
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- Receivable:
  id: Guid (auto)
  clinicId: Guid
  appointmentId: Guid? (FK Appointment, nullable for manual receivable)
  patientId: Guid? (FK Patient; patient associated with a manual payment, same clinic)
  originalAmount: decimal
  receivedAmount: decimal (sum of payments)
  status: ReceivableStatus (Pending|Partial|Paid|Cancelled)
  dueDate: DateTimeOffset (UTC)
  description: string?
  professionalId: Guid? (FK Doctor; snapshot from appointment)
  clinicSharePercentage: decimal (0..100; snapshot when appointment is billed)
  outstandingAmount: decimal = originalAmount - receivedAmount (computed)
  responseAppointmentDetails: appointment startAt, type, status, doctorId and doctorName when linked
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- Payment:
  id: Guid (auto)
  clinicId: Guid
  receivableId: Guid (FK Receivable)
  amount: decimal
  paymentMethod: PaymentMethod (Cash|Pix|CreditCard|DebitCard|Insurance)
  status: PaymentStatus (Paid|Refunded)
  paidAt: DateTimeOffset (UTC)
  destinationBank: string? (max 100; bank/account where the revenue was deposited)
  fundsRecipient: FundsRecipient (Clinic|Owner)
  clinicRevenueAmount: decimal (recognized clinic revenue)
  professionalPayableAmount: decimal (liability, never expense)
  professionalPaidAt: DateTimeOffset? (liability settlement)
  ownerSettledAt: DateTimeOffset? (cash received from CEO; never new revenue)
  notes: string?
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- Expense:
  id: Guid (auto)
  clinicId: Guid
  description: string
  amount: decimal
  categoryId: Guid (FK ExpenseCategory)
  paymentMethod: PaymentMethod
  paidAt: DateTimeOffset (UTC)
  status: ExpenseStatus (Paid|Pending|Cancelled)
  notes: string?
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- ExpenseCategory:
  id: Guid (auto)
  clinicId: Guid
  name: 'string (unique per clinic: clinicId+name index)'
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- Product:
  id: Guid (auto)
  clinicId: Guid
  name: 'string (unique per clinic: clinicId+name index)'
  price: decimal (> 0)
  applicationCount: int (> 0, default 1)
  isActive: bool (default true)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- Package:
  id: Guid (auto)
  clinicId: Guid
  name: 'string (unique per clinic: clinicId+name index)'
  price: decimal (> 0)
  isActive: bool (default true)
  items: '[PackageItem] (at least one)'
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- PackageItem:
  id: Guid (auto)
  clinicId: Guid
  packageId: Guid (FK Package)
  productId: Guid (FK Product)
  applicationCount: int (> 0)
  # Unique index: (packageId, productId)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- PatientProductBalance:
  id: Guid (auto)
  clinicId: Guid
  patientId: Guid (FK Patient)
  productId: Guid (FK Product)
  source: ApplicationBalanceSource (Package|Individual)
  packageId: Guid? (FK Package; set when source=Package)
  purchasedUnits: int (> 0; entitlement granted on sale)
  usedUnits: int (>= 0; consumed by recorded applications)
  # remainingUnits = purchasedUnits - usedUnits (computed)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- PatientApplication:
  id: Guid (auto)
  clinicId: Guid
  patientId: Guid (FK Patient)
  productId: Guid (FK Product)
  quantity: int (> 0)
  appliedAt: DateTimeOffset (UTC)
  doctorId: Guid? (FK Doctor; who applied)
  notes: string?
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- PatientDocument:
  id: Guid (auto)
  clinicId: Guid
  patientId: Guid (FK Patient)
  fileName: string
  contentType: string
  sizeInBytes: long (max 10MB per upload validation)
  storagePath: 'string (format: "clinics/{clinicId}/patients/{patientId}/{fileName}")'
  # Inherited: CreatedAt, UpdatedAt, DeletedAt
  # Note: actual storage is S3 or local filesystem fallback

- HealthInsurance:
  id: Guid (auto)
  clinicId: Guid
  name: 'string (unique per clinic: clinicId+name index)'
  phone: string?
  contactName: string?
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- Specialty:
  id: Guid (auto)
  clinicId: Guid
  name: 'string (unique per clinic: clinicId+name index)'
  doctorSpecialties: '[DoctorSpecialty] (many-to-many via Doctor)'
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- DoctorSpecialty:
  id: Guid (auto)
  clinicId: Guid
  doctorId: Guid (FK Doctor)
  specialtyId: Guid (FK Specialty)
  # Unique index: (doctorId, specialtyId)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- DoctorAvailability:
  id: Guid (auto)
  clinicId: Guid
  doctorId: Guid (FK Doctor)
  dayOfWeek: int (0=Sunday..6=Saturday)
  startTime: TimeSpan
  endTime: TimeSpan
  isAvailable: bool (default true)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- ClinicalRecord:
  id: Guid (auto)
  clinicId: Guid
  appointmentId: Guid (FK Appointment, unique index)
  patientId: Guid (FK Patient)
  doctorId: Guid (FK Doctor)
  status: ClinicalRecordStatus (Draft|Finalized)
  chiefComplaint: string? (queixa principal)
  history: string? (história da doença atual)
  physicalExam: string? (exame físico)
  assessment: string? (avaliação/diagnóstico)
  plan: string? (plano de tratamento)
  finalizedAt: DateTimeOffset?
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- ClinicalRecordAddendum:
  id: Guid (auto)
  clinicId: Guid
  clinicalRecordId: Guid (FK ClinicalRecord)
  content: string
  authorId: Guid (FK User)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- PaymentIntent:
  id: Guid (auto)
  clinicId: Guid
  receivableId: Guid (FK Receivable)
  amount: decimal
  paymentMethod: PaymentMethod (Cash|Pix|CreditCard|DebitCard|Insurance; default Pix)
  status: PaymentIntentStatus (Created|Processing|Confirmed|Failed|Cancelled)
  gateway: string? (null for manual)
  gatewayReference: string? (external id)
  idempotencyKey: string (unique index)
  confirmedAt: DateTimeOffset?
  failureReason: string?
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- OutboxEvent:
  id: Guid (auto)
  clinicId: Guid?
  eventType: string (e.g. "appointment.created")
  payloadJson: string
  status: OutboxStatus (Pending|Processed|Failed)
  attempts: int
  processedAt: DateTimeOffset?
  lastError: string?
  # Inherited: CreatedAt, UpdatedAt, DeletedAt
  # Note: no tenant filter (ClinicId is nullable)

- AuditLog:
  id: Guid (auto)
  clinicId: Guid
  userId: Guid?
  action: string
  entityName: string
  entityId: Guid?
  payloadJson: string (JSON, default `{}`)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- RefreshToken:
  id: Guid (auto)
  clinicId: Guid
  userId: Guid (FK User)
  tokenHash: string (BCrypt)
  expiresAt: DateTimeOffset (UTC)
  revokedAt: DateTimeOffset?
  userAgent: string?
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- WebhookEvent:
  id: Guid (auto)
  clinicId: Guid
  source: string (default whatsapp)
  payloadJson: string (JSON, default `{}`)
  processed: bool
  processedAt: DateTimeOffset?
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- WhatsAppMessage:
  id: Guid (auto)
  clinicId: Guid
  patientId: Guid?
  phone: string
  message: string
  status: WhatsAppMessageStatus (Pending|Sent|Delivered|Failed|Read)
  direction: MessageDirection (Inbound|Outbound)
  providerMessageId: string?
  clientRequestId: Guid? (unique per clinic when present)
  providerTimestamp: DateTimeOffset? (UTC, received from Meta; used for service window)
  # Unique (clinicId, direction, providerMessageId) when providerMessageId is present.
  # Index (clinicId, phone, createdAt); phone normalized at every write and by migration.
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- ClinicWhatsAppConfig:
  id: Guid (auto)
  clinicId: Guid (FK Clinic, unique index)
  phoneNumberOfId: string (unique among non-deleted configs)
  accessToken: string (should be encrypted at rest)
  wABAId: string?
  isEnabled: bool (default false)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- ClinicPaymentGatewayConfig:
  id: Guid (auto)
  clinicId: Guid (FK Clinic, unique index)
  provider: PaymentGatewayProvider (Asaas|MercadoPago|Stripe)
  apiKey: string? (should be encrypted at rest)
  secret: string? (should be encrypted at rest)
  environment: PaymentGatewayEnvironment (Sandbox|Production)
  webhookSecret: string?
  isEnabled: bool (default false)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- ClinicNotificationConfig:
  id: Guid (auto)
  clinicId: Guid (FK Clinic, unique index)
  reminderHoursBefore: int (default 24)
  channelsJson: string (JSON array, default ["whatsapp"])
  quietHoursStart: string? (HH:mm)
  quietHoursEnd: string? (HH:mm)
  enableAutoReminders: bool (default true)
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- ClinicBranding:
  id: Guid (auto)
  clinicId: Guid (FK Clinic, unique index)
  logoUrl: string?
  primaryColor: string? (hex)
  secondaryColor: string? (hex)
  customClinicName: string?
  # Inherited: CreatedAt, UpdatedAt, DeletedAt

- ClinicalCatalogItem:
  id: Guid
  clinicId: Guid
  kind: string (Document|Exam|Food|Anamnesis|Questionnaire)
  folder: string (required, max 120)
  title: string (required, max 200)
  content: string (max 30000, plain text)
  fieldsJson: string (serialized ClinicalField[], see clinical-workspace.yaml)
  ownerUserId: Guid? (null shared; personal doctor UserId)
  revision: Guid (optimistic concurrency token)
  # Entity timestamps and soft delete inherited
- ClinicalEntry:
  id: Guid
  clinicId: Guid
  appointmentId: Guid (FK Appointment)
  patientId: Guid (FK Patient)
  doctorId: Guid (FK Doctor)
  authorId: Guid (FK User)
  clientRequestId: Guid (unique clinic + appointment + request)
  correctsEntryId: Guid? (same appointment and kind)
  kind: string (Document|ExamOrder|ExamResult|Anamnesis|Questionnaire|Nutrition|Summary)
  title: string (required, max 200)
  content: string (max 30000, immutable snapshot)
  fieldsJson: string (immutable field definition snapshot)
  valuesJson: string (validated answers, max 100)
  signatureMode: string (Paper|DigitalMock; Document only)
  patientName: string (snapshot)
  doctorName: string (snapshot)
  doctorCrm: string (snapshot)
  clinicName: string (snapshot)
  # Entity timestamps inherited; no update/delete endpoint
