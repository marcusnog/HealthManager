# Canonical business rules — source of truth.
# Code must match these. Deviations are bugs.

tenant:
  isolation: "Every clinic entity has clinicId. Global query filters on all TenantEntity tables enforce isolation by declaring principal's clinicId."
  bypass: "PlatformAdmin role bypasses tenant filter entirely (can see all clinics)."
  resolution_order: "1) X-Clinic-Id header (if present) -> 2) JWT claim clinic_id"
  cross_tenant: "No data leak between clinics. Second clinic seed ID: 22222222-2222-2222-2222-222222222222."
  settings_read: "Clinic staff can read settings only for the clinic resolved from the authenticated tenant context."
  settings_write: "Only Admin can update its own clinic settings. Slug and status are platform-managed and cannot be changed by this endpoint."
  settings_business_hours: "BusinessHoursJson must be a JSON object with start/end strings in HH:mm format and start earlier than end."

auth:
  login: "Email + password. Password hashed via BCrypt. Returns accessToken + refreshToken."
  refresh: "Refresh token hashed in DB. Token rotation: old refresh token revoked on refresh."
  logout: "Revokes the specific refresh token. Idempotent (silent if already revoked)."
  change_password: "Requires current password verification. Updates hash directly."
  patient_portal: "CPF + PatientAccessToken (Guid). Separate JWT, 7 day expiry. No refresh tokens."
  token_format: "JWT payload includes: sub (userId), clinic_id, email, name, role claims."

authorization:
  roles:
    PlatformAdmin: "All access, bypasses tenant filter. No clinicId in JWT."
    Admin: "Full clinic access. Manages users, patients, doctors, appointments, finances."
    Secretary: "Operational: patients, appointments. No doctor/expense management."
    Doctor: "Own clinic data. Can view schedule, mark appointment statuses."
    Patient: "Portal only. Scoped to own data via PatientAccessToken."

patients:
  medical_record_number: "Generated automatically from the patient id on creation as P-{first 12 uppercase hex digits}; clients cannot define or change it."

policies:
  PlatformAdminOnly: "Requires PlatformAdmin role. Used for /internal/* routes."
  ClinicAdminOrSecretary: "Requires Admin or Secretary. Used for patient management."
  ClinicStaff: "Requires Admin, Secretary, or Doctor. Used for appointments/scheduling."
  ClinicAdmin: "Requires Admin. Used for tenant-wide configuration."
  PatientPortal: "Requires Patient role. Used for /patient-portal/* routes."

finance:
  expense_category: "Expenses reference a clinic-managed category. Category names are unique per clinic and categories in use cannot be deleted."
  partial_payment: "Payments can be partial. receivedAmount tracks running total. Receivable status auto-computed: Pending(0) -> Partial(>0 && <original) -> Paid(==original)."
  payment_exceeds: "Rejected if new receivedAmount would exceed originalAmount."
  payment_cancelled: "Payments against a Cancelled receivable are rejected."
  cancellation: "Appointment cancellation cancels linked receivable unless already Paid."
  appointment_sync: "Appointment receivable stays synchronized with schedule date, amount, type/description and appointment details. Changing amount from 0 to >0 creates it; changing to 0 cancels it when no amount was received; amount changes recompute receivable status and cannot go below receivedAmount."
  manual_receivable: "POST /payments supports creating a standalone receivable+payment in one call (no appointment link)."

scheduling:
  appointment_type: "Appointments reference a clinic-managed type. Type names are unique per clinic and types in use cannot be deleted."
  conflict: "Same doctor cannot have overlapping non-cancelled appointments. Validated on create and update."
  business_hours: "Appointment start-end must fall within clinic BusinessHoursJson window. Clinic timezone applied."
  default_duration: "30 minutes if durationMinutes is 0."
  amount_auto: "Appointment with amount > 0 auto-creates a Receivable."

documents:
  storage_fallback: "AWS_S3_BUCKET set -> S3. Not set -> local filesystem (LOCAL_STORAGE_ROOT or temp dir)."
  soft_delete: "Documents are soft-deleted via DeletedAt, not physically removed from storage."
  size_limit: "CreatePatientDocumentRequest validates SizeInBytes up to 10MB."

clinical_records:
  one_per_appointment: "Each appointment has at most one ClinicalRecord (appointmentId unique index)."
  creation: "Created as Draft when doctor starts consultation. Automatically linked to appointment, patient, and doctor."
  editing: "Only the owning doctor can edit Draft fields (chiefComplaint, history, physicalExam, assessment, plan)."
  finalization: "Draft -> Finalized. Sets finalizedAt. Irreversible. Finalized records are read-only."
  addendum: "After finalization, corrections are made via ClinicalRecordAddendum. Each addendum has content, authorId, and timestamp."
  access_read: "Admin, Secretary, and the owning Doctor can read clinical records."
  access_write: "Only the owning Doctor can create/update Draft and add addendums."
  patient_isolation: "Clinical records respect tenant isolation (clinicId query filter)."

payment_intents:
  creation: "Create intent linked to a receivable. Idempotency via idempotencyKey."
  confirmation: "Manual confirmation creates Payment and updates Receivable status (Pending -> Partial -> Paid)."
  idempotency: "Same idempotencyKey returns existing intent without creating duplicate."
  amount_validation: "Intent amount must not exceed receivable outstanding amount."
  cancellation: "Intent can be cancelled if not yet confirmed."
  gateway_independence: "Internal states are independent of gateway. Gateway adapter added later."

address_lookup:
  provider: "ViaCEP, called only by the backend through GET https://viacep.com.br/ws/{cep}/json/."
  credentials: "No token or commercial contract is required."
  validation: "CEP is normalized to exactly 8 digits before lookup."
  not_found: "A ViaCEP response containing erro=true is mapped to HTTP 404."
  resilience: "Provider failures are mapped to HTTP 502 and never prevent manual address entry."

audit:
  deletes: "Patient and doctor soft deletes generate AuditLog entries with action = 'patient.deleted' / 'doctor.deleted'."
  document_deletes: "Patient document deletes generate 'patient_document.deleted' audit entry."

tenant_integration:
  whatsapp_config: "One WhatsApp config per clinic (unique on clinicId). Stores Meta Cloud API credentials (phoneNumberOfId, accessToken, wABAId). Access token should be encrypted at rest."
  payment_gateway_config: "One payment gateway config per clinic. Provider enum: Asaas|MercadoPago|Stripe. Environment: Sandbox|Production. Stores API key, secret, webhook secret."
  notification_config: "One notification config per clinic. Controls reminder timing (hours before), channels (JSON array), quiet hours, and auto-reminder toggle."
  branding: "One branding config per clinic. Logo URL, primary/secondary hex colors, custom clinic name override."
  read_write: "All config endpoints require ClinicAdmin policy. GET returns all configs for the authenticated clinic. PUTs are upserts."
  tenant_isolation: "All config entities have clinicId FK and query filter. Configs are invisible to other clinics."

payment_gateway_processing:
  webhook_receiver: "POST /webhooks/payments/{provider} — generic receiver for any gateway. No auth required. HMAC signature verified via WebhookSignatureVerifier (provider-specific header)."
  signature_verification: "Shared WebhookSignatureVerifier handles Asaas (X-Asaas-Signature), MercadoPago (X-Signature), Stripe (X-Hub-Signature-256). All use HMAC-SHA256 with hex comparison."
  handler_resolver: "PaymentGatewayHandlerResolver resolves IPaymentGatewayHandler by provider enum value. Each handler maps gateway-specific payloads to WebhookPaymentResult."
  signalr_broadcast: "On successful webhook processing, PaymentHub broadcasts PaymentStatusChanged event to the clinic's SignalR group."
  hub_auth: "PaymentHub requires JWT auth (ClinicStaff policy). JoinClinicGroup(clinicId) validates JWT clinic_id claim matches the requested clinicId — prevents joining arbitrary groups."

whatsapp_messaging:
  meta_cloud_api: "Outbound messages sent via Meta Graph API v21.0 (typed HTTP client). Each clinic has its own phoneNumberOfId and accessToken."
  config_check: "SendAsync verifies ClinicWhatsAppConfig exists and IsEnabled=true for the clinic. Returns error if not configured."
  phone_normalization: "Brazilian phone numbers normalized to international format: strip non-digits, prepend '55' if 10 or 11 digits."
  message_persist: "Every outbound message stored as WhatsAppMessage (direction=Outbound, status=Sent|Failed, providerMessageId)."
  appointment_integration: "SendAppointmentConfirmationAsync and SendAppointmentCancellationAsync are service-level convenience methods. Call them from AppointmentService on status transitions."
  outbox_events: "Confirmation messages also enqueue 'whatsapp.appointment.confirmed' outbox event for downstream processing."
  timezone: "Appointment dates displayed in clinic timezone (hardcoded BRT offset for now — upgrade path: resolve from clinic config)."

outbox:
  events: "appointment.created, appointment.updated, appointment.cancelled, whatsapp.appointment.confirmed"
  batch: "OutboxProcessor takes 25 pending events per iteration."
  worker_poll: "OutboxWorker polls every 15 seconds."
  lambda: "Lambda function (custom runtime, AssemblyName=bootstrap) processes outbox for AWS deployment."

